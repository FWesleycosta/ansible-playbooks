---
# Keeps the GitHub Actions pinned by commit SHA up to date, with one pull request per week to develop.
# The tool images pinned by digest in the workflows and the uv and zizmor versions are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Waits a week before proposing a new release, so a compromised version has time to be caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
