[defaults]
# The lab is the default target: local containers only, never a real host.
inventory = inventories/lab/hosts.yml
roles_path = roles
# Collections come from requirements.yml (pinned) and live inside the project.
collections_path = .ansible/collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 10
nocows = True
# Host key checking stays on (Ansible default). Privilege escalation is declared
# per play or per task, not globally.

[ssh_connection]
pipelining = True
