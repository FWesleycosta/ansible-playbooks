---
# Lab environment: containers started by `make lab-up` (lab/compose.yml).
# Ansible reaches them through the Docker connection plugin, so there is no IP,
# no SSH and no real host in this inventory.
all:
  vars:
    ansible_connection: community.docker.docker
  children:
    web:
      hosts:
        web-01:
          ansible_host: lab-web-01
        web-02:
          ansible_host: lab-web-02
    db:
      hosts:
        db-01:
          ansible_host: lab-db-01
