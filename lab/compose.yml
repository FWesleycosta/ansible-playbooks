---
# Local lab: three Ubuntu hosts with systemd, reached by Ansible through the
# Docker connection plugin (see inventories/lab/hosts.yml).
# Local use only: privileged mode and the host cgroup let systemd run as on a virtual machine.
# The "localhost/" image prefix keeps Docker from ever pulling a same-named image from a registry.
name: ansible-playbooks-lab

x-host: &host
  image: localhost/ansible-playbooks/test-ubuntu:24.04
  build:
    context: ../tests/images/ubuntu
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw

services:
  web-01:
    <<: *host
    container_name: lab-web-01
    hostname: web-01
  web-02:
    <<: *host
    container_name: lab-web-02
    hostname: web-02
  db-01:
    <<: *host
    container_name: lab-db-01
    hostname: db-01
