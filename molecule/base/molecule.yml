---
# Tests the base role on Ubuntu 24.04 and 26.04 containers with systemd.
# Run from the repository root: `make test-role ROLE=base`.
# The images are built locally by `make image`; the "localhost/" prefix prevents any pull.

# Molecule runs Ansible with an ansible.cfg of its own, which does not read the
# repository's ansible.cfg. The project paths are repeated here, relative to this scenario.
ansible:
  cfg:
    defaults:
      roles_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
      collections_path: ${MOLECULE_SCENARIO_DIRECTORY}/../../.ansible/collections

# Disabled because the Molecule prerun already installs requirements.yml from the
# repository root; this step only looks for requirement files inside the scenario.
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: base-ubuntu-2404
    image: localhost/ansible-playbooks/test-ubuntu:24.04
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: base-ubuntu-2604
    image: localhost/ansible-playbooks/test-ubuntu:26.04
    pre_build_image: true
    override_command: false
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Values different from the defaults, so the test proves that overrides work.
        base_timezone: America/Sao_Paulo
        base_packages_extra:
          - jq
        base_motd_message: Molecule test host

verifier:
  name: ansible
